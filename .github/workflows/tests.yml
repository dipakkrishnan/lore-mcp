name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run --extra dev ruff check lore tests support
      - run: uv run --extra dev ruff format --check lore tests support

  python-unit:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run python -m unittest discover -s tests -v

  python-types:
    name: Python type checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run --extra dev mypy lore support

  bridge-check:
    name: Bridge compiler checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      - run: npm run check
      - run: npm test

  desktop-check:
    name: Desktop macOS checks
    runs-on: macos-14
    defaults:
      run:
        working-directory: app/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: astral-sh/setup-uv@v7
      - run: npm ci
      - run: npm run check
      - run: npm test
      # APP-104: renderer.js has no unit coverage — it is only reachable
      # through real Electron (support/edge.cjs). This one scenario runs here
      # because it guards two reviewed regressions with no other net: a
      # second Send filing a second public issue, and an in-flight report
      # closing a sheet the owner opened after it. The rest of `test:edge`
      # stays a local, attended check.
      - run: support/edge.sh feedback
        timeout-minutes: 5
      - run: npm run package

  node-lint:
    name: Node lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lore/node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      - run: npm run lint

  node-compiler:
    name: Node compiler checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lore/node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      # Burn address: syntactically valid so Wrangler can construct the
      # Worker, never a real payout wallet.
      - run: echo "LORE_WALLET=0x000000000000000000000000000000000000dEaD" > .dev.vars
      - run: npm run types
      - run: npm run check

  node-component:
    name: Node component tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lore/node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      - run: echo "LORE_WALLET=0x000000000000000000000000000000000000dEaD" > .dev.vars
      - name: Run the mocked-facilitator test suite (MON-010)
        run: npm test

  feedback-relay-lint:
    name: Feedback relay lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: feedback-relay
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      - run: npm run lint

  feedback-relay-compiler:
    name: Feedback relay compiler checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: feedback-relay
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      # Placeholder: never a real GitHub token. Lets `wrangler types` resolve
      # the secret binding the same way CI seeds LORE_WALLET for lore/node.
      - run: echo "LORE_FEEDBACK_GITHUB_TOKEN=not-a-real-token" > .dev.vars
      - run: npm run types
      - run: npm run check

  feedback-relay-component:
    name: Feedback relay component tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: feedback-relay
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      - run: echo "LORE_FEEDBACK_GITHUB_TOKEN=not-a-real-token" > .dev.vars
      - name: Run the stubbed-GitHub test suite (XC-028)
        run: npm test

  worker-smoke:
    name: Worker smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lore/node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: astral-sh/setup-uv@v7
      - run: npm ci
      - run: echo "LORE_WALLET=0x000000000000000000000000000000000000dEaD" > .dev.vars
      - name: Seed local publications with a real `lore push --local`
        # Runs the actual push path (lore/cli.py:push, :_push_sql) against the
        # same local D1 database discover()/get() read, instead of a
        # hand-copied schema that can silently drift from what `lore push`
        # really writes (see XC-016).
        env:
          # `push` refuses a piped, unattended caller unless it looks like the
          # desktop app driving it non-interactively (lore/cli.py:_owner_action)
          # — CI is exactly that kind of unattended, non-TTY caller.
          LORE_ATTENDED_SURFACE: desktop
        run: |
          export LORE_HOME="$(mktemp -d)"
          uv run --project .. python ../../.github/scripts/seed_worker_smoke.py
          uv run --project .. lore push --local --worker-dir .
      - name: Smoke test against a locally served Worker
        env:
          # Must match the topic/teaser seeded above; smoke.ts checks discover()
          # returns this exact publication, not just that some row exists.
          SMOKE_EXPECT_TOPIC: ci-smoke
          SMOKE_EXPECT_TEASER: "worker-smoke: seeded via a real lore push --local"
        run: |
          nohup npm run dev > wrangler-dev.log 2>&1 &
          echo $! > wrangler-dev.pid
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:8787/mcp && break
            sleep 1
          done
          npm run smoke
      - name: Show Worker dev log on failure
        if: failure()
        run: cat wrangler-dev.log
      - name: Stop the Worker
        if: always()
        run: kill "$(cat wrangler-dev.pid)" 2>/dev/null || true
