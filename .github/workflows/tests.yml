name: CI

on:
  pull_request:
  push:
    branches: [main]

# XC-081: a new push to a pull request cancels the run it supersedes, so a
# stale run does not hold one of the five macOS runners the fresh one needs.
# Pull request runs share a group per PR (github.ref is refs/pull/<n>/merge).
# Pushes to main are keyed on the commit, one group each, so nothing on main
# is ever cancelled: GitHub keeps at most one pending run per group, so a
# shared main group would drop the middle of three quick pushes even with
# cancel-in-progress off.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run --extra dev ruff check lore tests evals .github/scripts docs/backlog/agents support/seed
      - run: uv run --extra dev ruff format --check lore tests evals .github/scripts docs/backlog/agents support/seed

  python-unit:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run python -m unittest discover -s tests -v

  python-types:
    name: Python type checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run --extra dev mypy lore evals .github/scripts docs/backlog/agents support/seed

  bridge-check:
    name: Bridge compiler checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      - run: npm run check
      - run: npm test

  # XC-078: which of the pull request's changed files can reach the desktop
  # job. About a third of merged PRs touch none of them (a backlog item, the
  # site, the Worker, a Python test) and used to hold a macOS runner for about
  # 19 minutes each. The rules live in .github/scripts/desktop_inputs.py. This
  # is a job-level gate, never a workflow-level `paths` filter: nine required
  # checks come from this workflow under a strict up-to-date rule, and a
  # filtered-out workflow would leave every such PR stuck at "Expected".
  changes:
    name: Which inputs changed
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The pull_request checkout is the merge of base and head; its first
          # parent is base, so one extra commit of history is the whole PR diff.
          fetch-depth: 2
      - id: filter
        # bash, not the default shell, for pipefail: a failed diff is red, not
        # an empty list. --no-renames lists a move as its deletion and its
        # addition, so a file moved out of app/desktop still counts.
        shell: bash
        run: git diff --no-renames --name-only HEAD^1 HEAD | python3 .github/scripts/desktop_inputs.py

  desktop-check:
    name: Desktop macOS checks
    runs-on: macos-14
    needs: changes
    # Runs on every push to main (XC-079 is the item that would change that),
    # and on a pull request unless `changes` said its files cannot reach this
    # job. Fail open: if `changes` failed or was skipped, its output is empty,
    # not 'false', and the job still runs; `!cancelled()` is what lets a job
    # whose `needs` did not succeed run at all.
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.desktop != 'false') }}
    defaults:
      run:
        working-directory: app/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: astral-sh/setup-uv@v7
      - run: npm ci
      - run: npm run check
      - run: npm test
      # renderer.js has no unit coverage — it is only reachable through real
      # Electron (support/edge.cjs). XC-077: support/walks.cjs holds the one
      # list of walks that `npm run test:edge` and CI both run, two at a time
      # on this one runner (macos-14, three cores: two side by side take as
      # long as one alone; a third slows every walk two to two and a half times
      # and fails a third of them, so --jobs stays at 2). One macOS job per
      # run, on purpose: the account is capped at five macOS jobs at once and
      # the arm64 pool queues at busy hours, so more jobs per run meant more
      # waiting, not less (#559, #560). A failing walk is a `FAIL <walk>` log
      # group holding its output, an ::error annotation naming it, and a
      # **FAIL** row in the step summary; one failure does not stop the others.
      # A new walk is one line in support/walks.cjs. `test:capture` is
      # attended and stays local (see app/desktop/README.md).
      # Walks start side by side, so the project's environment is built once,
      # before any of them.
      - run: uv sync --locked
        working-directory: .
      # XC-084: twenty minutes, not fifteen: a slow runner plus a retried
      # `agents` ran past 15 once, and a step that times out prints no summary
      # and saves no cache. Still inside the 19-minute job XC-077 replaced.
      - run: node support/walks.cjs --jobs 2
        timeout-minutes: 20
      # XC-082: whisper.sh clones and builds whisper.cpp at a pinned tag (about a
      # minute) and node.sh downloads a pinned npm, the same bytes every run.
      # Both scripts already skip their work when their outputs are in place,
      # so a cache hit makes `npm run package` about 25 s instead of 83. Keyed
      # on the two scripts only: a change to a tag or a flag misses and
      # rebuilds; a change to src/ hits. No restore-keys, so a miss is visible
      # rather than papered over by a binary from another tag. The cache is
      # saved only when the job succeeds, so the first save after a key change
      # waits for a green job.
      - uses: actions/cache@v4
        with:
          path: |
            app/desktop/packaging/out/whisper
            app/desktop/packaging/out/node
          key: packaging-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/desktop/packaging/whisper.sh', 'app/desktop/packaging/node.sh') }}
      - run: npm run package
      # The packaged app carries whisper-cli at the tag whisper.sh pins, on a
      # cache hit as on a miss.
      - name: Packaged whisper is the pinned tag
        run: |
          shipped="$(cat out/Lore-darwin-arm64/Lore.app/Contents/Resources/whisper/version)"
          pinned="$(sed -n 's/^WHISPER_TAG=//p' packaging/whisper.sh)"
          echo "shipped $shipped, pinned $pinned"
          [ "$shipped" = "$pinned" ] || { echo "::error title=stale whisper-cli::The packaged app carries whisper.cpp $shipped but whisper.sh pins $pinned."; exit 1; }

  node-lint:
    name: Node lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lore/node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      - run: npm run lint

  node-compiler:
    name: Node compiler checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lore/node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      # Burn address: syntactically valid so Wrangler can construct the
      # Worker, never a real payout wallet.
      - run: echo "LORE_WALLET=0x000000000000000000000000000000000000dEaD" > .dev.vars
      - run: npm run types
      - run: npm run check

  node-component:
    name: Node component tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lore/node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      - run: echo "LORE_WALLET=0x000000000000000000000000000000000000dEaD" > .dev.vars
      - name: Run the mocked-facilitator test suite (MON-010)
        run: npm test

  feedback-relay-lint:
    name: Feedback relay lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: feedback-relay
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      - run: npm run lint

  feedback-relay-compiler:
    name: Feedback relay compiler checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: feedback-relay
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      # Placeholder: never a real GitHub token. Lets `wrangler types` resolve
      # the secret binding the same way CI seeds LORE_WALLET for lore/node.
      - run: printf 'LORE_FEEDBACK_GITHUB_TOKEN=not-a-real-token\nPOSTHOG_KEY=not-a-real-key\n' > .dev.vars
      - run: npm run types
      - run: npm run check

  feedback-relay-component:
    name: Feedback relay component tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: feedback-relay
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      - run: printf 'LORE_FEEDBACK_GITHUB_TOKEN=not-a-real-token\nPOSTHOG_KEY=not-a-real-key\n' > .dev.vars
      - name: Run the stubbed-GitHub test suite (XC-028)
        run: npm test

  checkout-lint:
    name: Card checkout lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: checkout
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      - run: npm run lint

  checkout-compiler:
    name: Card checkout compiler checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: checkout
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      # Placeholder: never a real Stripe key. Lets `wrangler types` resolve
      # the secret binding the same way the feedback relay's job does.
      - run: printf "STRIPE_SECRET_KEY=sk_test_not_a_real_key\nSTRIPE_WEBHOOK_SECRET=whsec_not_a_real_secret\nACCOUNT_TOKEN_SECRET=not_a_real_token_secret\n" > .dev.vars
      - run: npm run types
      - run: npm run check

  checkout-component:
    name: Card checkout component tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: checkout
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      - run: printf "STRIPE_SECRET_KEY=sk_test_not_a_real_key\nSTRIPE_WEBHOOK_SECRET=whsec_not_a_real_secret\nACCOUNT_TOKEN_SECRET=not_a_real_token_secret\n" > .dev.vars
      - name: Run the stubbed-Stripe test suite (XC-039)
        run: npm test

  worker-smoke:
    name: Worker smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lore/node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: astral-sh/setup-uv@v7
      - run: npm ci
      - run: echo "LORE_WALLET=0x000000000000000000000000000000000000dEaD" > .dev.vars
      - name: Seed local publications with a real `lore push --local`
        # Runs the actual push path (lore/cli.py:push, :_push_sql) against the
        # same local D1 database discover()/get() read, instead of a
        # hand-copied schema that can silently drift from what `lore push`
        # really writes (see XC-016).
        env:
          # `push` refuses a piped, unattended caller unless it holds the
          # desktop app's launch key (lore/cli.py:_attended), so CI writes one.
          LORE_ATTENDED_KEY: ci
        run: |
          # As the app writes it: a folder and a file only the owner can open.
          (umask 077 && mkdir -p ~/"Library/Application Support/Lore/attended.d" &&
            printf '%s\nci\n' "$$" > ~/"Library/Application Support/Lore/attended.d/ci")
          export LORE_HOME="$(mktemp -d)"
          uv run --project .. python ../../.github/scripts/seed_worker_smoke.py
          uv run --project .. lore push --local --worker-dir .
      - name: Smoke test against a locally served Worker
        env:
          # Must match the topic/teaser seeded above; smoke.ts checks discover()
          # returns this exact publication, not just that some row exists.
          SMOKE_EXPECT_TOPIC: ci-smoke
          SMOKE_EXPECT_TEASER: "worker-smoke: seeded via a real lore push --local"
        run: |
          nohup npm run dev > wrangler-dev.log 2>&1 &
          echo $! > wrangler-dev.pid
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:8787/mcp && break
            sleep 1
          done
          npm run smoke
      - name: Show Worker dev log on failure
        if: failure()
        run: cat wrangler-dev.log
      - name: Stop the Worker
        if: always()
        run: kill "$(cat wrangler-dev.pid)" 2>/dev/null || true
