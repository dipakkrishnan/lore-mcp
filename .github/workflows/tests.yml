name: CI

on:
  pull_request:
  push:
    branches: [main]

# XC-081: a new push to a pull request cancels the run it supersedes, so a
# stale run does not hold one of the five macOS runners the fresh one needs.
# Pull request runs share a group per PR (github.ref is refs/pull/<n>/merge).
# Pushes to main are keyed on the commit, one group each, so nothing on main
# is ever cancelled: GitHub keeps at most one pending run per group, so a
# shared main group would drop the middle of three quick pushes even with
# cancel-in-progress off.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run --extra dev ruff check lore tests evals .github/scripts docs/backlog/agents support/seed
      - run: uv run --extra dev ruff format --check lore tests evals .github/scripts docs/backlog/agents support/seed

  python-unit:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # XC-096: the suite runs under coverage and every file in lore/ is held
      # to 90% statements and 90% branches, checked per file (tests/gate.py
      # explains why one global fail_under is not enough). The Worker steps
      # gate.py also knows are this workflow's own jobs, so only the Python
      # half runs here. The per-file table lands in the step summary.
      # XC-097: the tests that start real processes live in tests/integration
      # and run in python-integration, so this tier is the in-process one.
      # XC-106: -n auto spreads it over pytest-xdist workers, one per core;
      # every test owns a temp LORE_HOME and binds port 0, so nothing is
      # shared. gate.py measures the workers through pytest-cov and still
      # prints the one per-file table.
      # XC-107: teed to a log so tier_summary.py can put the tier's size and
      # time in the step summary, beside gate.py's coverage table.
      - name: Python unit tests
        run: set -o pipefail; uv run python tests/gate.py --python-only --ignore=tests/integration -n auto 2>&1 | tee pytest.log
      - name: Tier table in the step summary (report-only)
        if: always()
        run: python3 .github/scripts/tier_summary.py --title Python --tier Unit pytest.log

  python-integration:
    name: Python integration tests
    runs-on: ubuntu-latest
    # XC-107: the unit tier first. A broken pure function is read off the unit
    # job's log, and the integration tier (real processes) does not start on a
    # commit whose unit tier already failed. It waits about a minute and a half
    # for that, well inside the desktop job's ten.
    needs: python-unit
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # test_real_uv_install reaches PyPI, so a PR never depends on it; it runs
      # weekly from python-floor.yml.
      - name: Python integration tests
        run: set -o pipefail; uv run --extra dev python -m pytest tests/integration -k "not real_uv_install" -q 2>&1 | tee pytest.log
      - name: Tier table in the step summary (report-only)
        if: always()
        run: python3 .github/scripts/tier_summary.py --title Python --tier Integration pytest.log

  python-types:
    name: Python type checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run --extra dev mypy lore evals .github/scripts docs/backlog/agents support/seed

  bridge-check:
    name: Bridge compiler checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      - run: npm run check
      - run: npm test

  # XC-078: which of the pull request's changed files can reach the desktop
  # job. About a third of merged PRs touch none of them (a backlog item, the
  # site, the Worker, a Python test) and used to hold a macOS runner for about
  # 19 minutes each. The rules live in .github/scripts/desktop_inputs.py. This
  # is a job-level gate, never a workflow-level `paths` filter: nine required
  # checks come from this workflow under a strict up-to-date rule, and a
  # filtered-out workflow would leave every such PR stuck at "Expected".
  changes:
    name: Which inputs changed
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The pull_request checkout is the merge of base and head; its first
          # parent is base, so one extra commit of history is the whole PR diff.
          fetch-depth: 2
      - id: filter
        # bash, not the default shell, for pipefail: a failed diff is red, not
        # an empty list. --no-renames lists a move as its deletion and its
        # addition, so a file moved out of app/desktop still counts.
        shell: bash
        run: git diff --no-renames --name-only HEAD^1 HEAD | python3 .github/scripts/desktop_inputs.py

  desktop-check:
    name: Desktop macOS checks
    # XC-111: macos-15, pinned rather than macos-latest, so the walk timings
    # XC-083 measures stay on one machine class; macos-14 is retired on
    # 2026-11-02 (actions/runner-images#13518).
    runs-on: macos-15
    env:
      # XC-111: the macos-15 image ships Homebrew Python 3.15, which uv would
      # pick, and pydantic-core has no 3.15 wheel: the first `uv run` then
      # compiles it for minutes. macos-14 had no usable Python and uv fetched
      # a managed 3.12. Pin the version the app is developed on so the job
      # tests one known interpreter and every dependency arrives as a wheel.
      UV_PYTHON: "3.14"
    needs: changes
    # Runs on every push to main (XC-079 is the item that would change that),
    # and on a pull request unless `changes` said its files cannot reach this
    # job. Fail open: if `changes` failed or was skipped, its output is empty,
    # not 'false', and the job still runs; `!cancelled()` is what lets a job
    # whose `needs` did not succeed run at all.
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.desktop != 'false') }}
    defaults:
      run:
        working-directory: app/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # XC-121: pinned, not lts/*. When lts/* moved to Node 26 on
          # 2026-11-02, electron-forge 7.11.2 stopped at "Finalizing package"
          # and exited 0 with no app bundle. Lift the pin with a forge upgrade.
          node-version: 24
      - uses: astral-sh/setup-uv@v7
      - run: npm ci
      - run: npm run check
      # XC-126: on 2026-11-09 github.com answered release downloads with 504s
      # for three hours and this job failed on downloads, not code. Three
      # things came from GitHub releases on every run: Electron's binary, the
      # wheelhouse's uv, and its managed CPython. Each is now cached under a
      # key holding the pinned version, so a bump misses and downloads once.
      # XC-082's rules hold: no restore-keys, saved only by a green job.
      - name: Pinned download versions
        id: pins
        run: |
          echo "electron=$(node -p "require('./node_modules/electron/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "uv=$(sed -n 's/^UV_VERSION=//p' packaging/wheelhouse.sh)" >> "$GITHUB_OUTPUT"
          echo "python=$(sed -n 's/^PYTHON_VERSION=//p' packaging/wheelhouse.sh)" >> "$GITHUB_OUTPUT"
      # Electron 44 downloads its binary on the first require("electron"),
      # inside the unit tier; electron-forge fetches the same zip to package.
      # Both read this cache (forge.config.js gives the packager the shipped
      # checksums, so neither fetches SHASUMS256.txt). Unpacking here keeps the
      # download out of the tests. The step says which way it went: a miss
      # names the releases/download URL, a hit says the zip came from cache.
      - uses: actions/cache@v6
        id: electron-cache
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.electron }}
      - name: Unpack Electron
        env:
          HIT: ${{ steps.electron-cache.outputs.cache-hit }}
          VERSION: ${{ steps.pins.outputs.electron }}
        run: |
          zip="electron-v$VERSION-darwin-arm64.zip"
          if [ "$HIT" = "true" ]; then
            find ~/Library/Caches/electron -name "$zip" | grep -q . || { echo "::error title=electron cache::The cache hit holds no $zip."; exit 1; }
            echo "Electron $VERSION unpacked from the cache"
          else
            echo "Electron $VERSION not cached: fetching https://github.com/electron/electron/releases/download/v$VERSION/$zip"
          fi
          node node_modules/electron/install.js
      # XC-097: the desktop suite runs as two tiers, unit first (test/unit
      # starts no process, tiers.test.cjs holds that) then component (the tests
      # that spawn `uv run lore`). Each runs under node's own coverage
      # (XC-098: --experimental-test-coverage, Node 20+; the Node 24 pinned
      # above has it), teed to a log so tier_summary.py can put its size and
      # time in the step summary. Report-only: the summary steps never fail on
      # a number. node:test counts lines, not statements, and knows only the
      # files the tests loaded.
      # XC-107: the order is unit, component, the walks, then `npm run
      # package`, cheapest first, and a failed step skips every step after it.
      - name: Desktop unit tests
        run: set -o pipefail; npm run test:unit:coverage 2>&1 | tee unit.log
      # The component tests spawn `uv run lore`, so the project's environment
      # is built here, once, and not inside whichever test happens to run
      # first (XC-111: on a fresh interpreter that build ran a test past its
      # 120 s limit). The walks below reuse it. The unit tier needs none of it,
      # so it runs, and can fail, before this.
      - run: uv sync --locked
        working-directory: .
      - name: Desktop component tests
        run: set -o pipefail; npm run test:component:coverage 2>&1 | tee component.log
      # A tier whose log is missing did not run (the unit tier failed first)
      # and is a `not run` row.
      - name: Tier table in the step summary (report-only)
        if: always()
        run: python3 ../../.github/scripts/tier_summary.py --title app/desktop --tier Unit unit.log --tier Component component.log
      # The two tiers cover the same sources, so their lcov files are unioned
      # per line and branch, not summed. XC-108: and held to package.json's
      # coverageFloor; below it this step fails.
      - name: Coverage line and floor in the step summary
        if: always()
        run: python3 ../../.github/scripts/coverage_summary.py --name app/desktop --lcov coverage/unit.lcov coverage/component.lcov --floor package.json
      # renderer.js has no unit coverage — it is only reachable through real
      # Electron (support/edge.cjs). XC-077: support/walks.cjs holds the one
      # list of walks that `npm run test:edge` and CI both run, two at a time
      # on this one runner (macos-15, three cores: two side by side take as
      # long as one alone; a third slows every walk two to two and a half times
      # and fails a third of them, so --jobs stays at 2). One macOS job per
      # run, on purpose: the account is capped at five macOS jobs at once and
      # the arm64 pool queues at busy hours, so more jobs per run meant more
      # waiting, not less (#559, #560). A failing walk is a `FAIL <walk>` log
      # group holding its output, an ::error annotation naming it, and a
      # **FAIL** row in the step summary; one failure does not stop the others.
      # A new walk is one line in support/walks.cjs. `test:capture` is
      # attended and stays local (see app/desktop/README.md).
      # XC-084: twenty minutes, not fifteen: a slow runner plus a retried
      # `agents` ran past 15 once, and a step that times out prints no summary
      # and saves no cache. Still inside the 19-minute job XC-077 replaced.
      # XC-107: teed to a log, from which the next step counts the views the
      # walks' layout scan reached this run (support/views.json maps each
      # shot to its view), so a drop in scan coverage shows on the run itself.
      - name: Desktop walks
        run: set -o pipefail; node support/walks.cjs --jobs 2 2>&1 | tee walks.log
        timeout-minutes: 20
      - name: Layout scan in the step summary (report-only)
        if: always()
        run: python3 ../../.github/scripts/views_scanned.py --log walks.log --views support/views.json
      # XC-082: whisper.sh clones and builds whisper.cpp at a pinned tag (about a
      # minute) and node.sh downloads a pinned npm, the same bytes every run.
      # Both scripts already skip their work when their outputs are in place,
      # so a cache hit makes `npm run package` about 25 s instead of 83. Keyed
      # on the two scripts only: a change to a tag or a flag misses and
      # rebuilds; a change to src/ hits. No restore-keys, so a miss is visible
      # rather than papered over by a binary from another tag. The cache is
      # saved only when the job succeeds, so the first save after a key change
      # waits for a green job.
      - uses: actions/cache@v6
        with:
          path: |
            app/desktop/packaging/out/whisper
            app/desktop/packaging/out/node
          key: packaging-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/desktop/packaging/whisper.sh', 'app/desktop/packaging/node.sh') }}
      # XC-126: wheelhouse.sh skips its uv download when out/uv is already the
      # pinned version, and uv skips CPython when it is already installed in
      # UV_PYTHON_INSTALL_DIR. Keyed on UV_VERSION and PYTHON_VERSION. A miss
      # shows in the log as uv's "Downloading cpython-..." line and the uv URL wheelhouse.sh prints.
      - uses: actions/cache@v6
        id: wheelhouse-cache
        with:
          path: |
            app/desktop/packaging/out/uv
            ${{ runner.temp }}/uv-python
          key: wheelhouse-${{ runner.os }}-${{ runner.arch }}-uv${{ steps.pins.outputs.uv }}-py${{ steps.pins.outputs.python }}
      - run: npm run package
        env:
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/uv-python
          # On a hit, CPython is already there: a download would be a bug, so refuse it.
          UV_PYTHON_DOWNLOADS: ${{ steps.wheelhouse-cache.outputs.cache-hit == 'true' && 'never' || 'automatic' }}
      # The packaged app carries whisper-cli at the tag whisper.sh pins, on a
      # cache hit as on a miss.
      - name: Packaged whisper is the pinned tag
        run: |
          app=out/Lore-darwin-arm64/Lore.app
          # XC-121: forge can exit 0 without finishing (Node 26); say so, rather than "no such file".
          [ -f "$app/Contents/Resources/whisper/version" ] || { echo "::error title=no packaged app::npm run package left no $app/Contents/Resources/whisper/version; electron-forge did not finish."; ls -la out 2>/dev/null; exit 1; }
          shipped="$(cat "$app/Contents/Resources/whisper/version")"
          pinned="$(sed -n 's/^WHISPER_TAG=//p' packaging/whisper.sh)"
          echo "shipped $shipped, pinned $pinned"
          [ "$shipped" = "$pinned" ] || { echo "::error title=stale whisper-cli::The packaged app carries whisper.cpp $shipped but whisper.sh pins $pinned."; exit 1; }

  node-lint:
    name: Node lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lore/node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      - run: npm run lint

  node-compiler:
    name: Node compiler checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lore/node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      # Burn address: syntactically valid so Wrangler can construct the
      # Worker, never a real payout wallet.
      - run: echo "LORE_WALLET=0x000000000000000000000000000000000000dEaD" > .dev.vars
      - run: npm run types
      - run: npm run check

  node-component:
    name: Node component tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lore/node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      - run: echo "LORE_WALLET=0x000000000000000000000000000000000000dEaD" > .dev.vars
      # XC-099: the pure modules' tests first, in plain node (under a second), so a
      # failure there is read before the Workers pool spends its minute booting.
      - name: Unit tests in plain node (XC-099)
        run: set -o pipefail; npm run test:unit 2>&1 | tee unit.log
      # XC-098: the same two vitest runs with istanbul instrumentation (the only
      # provider the Workers pool supports). Report-only: the next step sums the
      # two Workers' coverage-summary.json files into one lore/node line of the
      # step summary and never fails on a number. The first run covers both the
      # node and the workerd project, so the unit tests run again here, instrumented.
      # XC-108: each run fails below the floor in its vitest config's coverage.thresholds.
      - name: Run the mocked-facilitator test suite (MON-010)
        run: set -o pipefail; npm run test:coverage 2>&1 | tee component.log
      - name: Coverage line in the step summary (report-only)
        if: always()
        run: python3 ../../.github/scripts/coverage_summary.py --name lore/node --istanbul coverage/coverage-summary.json coverage/hosted/coverage-summary.json
      # XC-107: the instrumented run holds the unit project again, so the
      # Component row is its count less the Unit row's.
      - name: Tier table in the step summary (report-only)
        if: always()
        run: python3 ../../.github/scripts/tier_summary.py --title lore/node --tier Unit unit.log --tier Component component.log --also-runs Component Unit

  feedback-relay-lint:
    name: Feedback relay lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: feedback-relay
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      - run: npm run lint

  feedback-relay-compiler:
    name: Feedback relay compiler checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: feedback-relay
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      # Placeholder: never a real GitHub token. Lets `wrangler types` resolve
      # the secret binding the same way CI seeds LORE_WALLET for lore/node.
      - run: printf 'LORE_FEEDBACK_GITHUB_TOKEN=not-a-real-token\nPOSTHOG_KEY=not-a-real-key\n' > .dev.vars
      - run: npm run types
      - run: npm run check

  feedback-relay-component:
    name: Feedback relay component tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: feedback-relay
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      - run: printf 'LORE_FEEDBACK_GITHUB_TOKEN=not-a-real-token\nPOSTHOG_KEY=not-a-real-key\n' > .dev.vars
      # XC-099: unit tests first, in plain node; see node-component.
      - name: Unit tests in plain node (XC-099)
        run: set -o pipefail; npm run test:unit 2>&1 | tee unit.log
      # XC-098: with istanbul instrumentation; see node-component. XC-108: fails
      # below the floor in vitest.config.ts's coverage.thresholds.
      - name: Run the stubbed-GitHub test suite (XC-028)
        run: set -o pipefail; npm run test:coverage 2>&1 | tee component.log
      - name: Coverage line in the step summary (report-only)
        if: always()
        run: python3 ../.github/scripts/coverage_summary.py --name feedback-relay --istanbul coverage/coverage-summary.json
      # XC-107: per-tier counts and seconds; see node-component.
      - name: Tier table in the step summary (report-only)
        if: always()
        run: python3 ../.github/scripts/tier_summary.py --title feedback-relay --tier Unit unit.log --tier Component component.log --also-runs Component Unit

  site-component:
    name: Site component tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      # XC-107: one tier (the site has no unit/component split yet), still
      # counted and timed in the step summary like every other test job.
      - name: Run the marketplace and bid book suite (MON-051)
        run: set -o pipefail; npm test 2>&1 | tee component.log
      - name: Tier table in the step summary (report-only)
        if: always()
        run: python3 ../.github/scripts/tier_summary.py --title site --tier Component component.log

  checkout-lint:
    name: Card checkout lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: checkout
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      - run: npm run lint

  checkout-compiler:
    name: Card checkout compiler checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: checkout
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      # Placeholder: never a real Stripe key. Lets `wrangler types` resolve
      # the secret binding the same way the feedback relay's job does.
      - run: printf "STRIPE_SECRET_KEY=sk_test_not_a_real_key\nSTRIPE_WEBHOOK_SECRET=whsec_not_a_real_secret\nSTRIPE_PLATFORM_WEBHOOK_SECRET=whsec_not_a_real_secret\nACCOUNT_TOKEN_SECRET=not_a_real_token_secret\n" > .dev.vars
      - run: npm run types
      - run: npm run check

  checkout-component:
    name: Card checkout component tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: checkout
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      - run: printf "STRIPE_SECRET_KEY=sk_test_not_a_real_key\nSTRIPE_WEBHOOK_SECRET=whsec_not_a_real_secret\nSTRIPE_PLATFORM_WEBHOOK_SECRET=whsec_not_a_real_secret\nACCOUNT_TOKEN_SECRET=not_a_real_token_secret\n" > .dev.vars
      # XC-099: unit tests first, in plain node; see node-component.
      - name: Unit tests in plain node (XC-099)
        run: set -o pipefail; npm run test:unit 2>&1 | tee unit.log
      # XC-098: with istanbul instrumentation; see node-component. XC-108: fails
      # below the floor in vitest.config.ts's coverage.thresholds.
      - name: Run the stubbed-Stripe test suite (XC-039)
        run: set -o pipefail; npm run test:coverage 2>&1 | tee component.log
      - name: Coverage line in the step summary (report-only)
        if: always()
        run: python3 ../.github/scripts/coverage_summary.py --name checkout --istanbul coverage/coverage-summary.json
      # XC-107: per-tier counts and seconds; see node-component.
      - name: Tier table in the step summary (report-only)
        if: always()
        run: python3 ../.github/scripts/tier_summary.py --title checkout --tier Unit unit.log --tier Component component.log --also-runs Component Unit

  worker-smoke:
    name: Worker smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lore/node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: astral-sh/setup-uv@v7
      - run: npm ci
      - run: echo "LORE_WALLET=0x000000000000000000000000000000000000dEaD" > .dev.vars
      - name: Seed local publications with a real `lore push --local`
        # Runs the actual push path (lore/cli.py:push, :_push_sql) against the
        # same local D1 database discover()/get() read, instead of a
        # hand-copied schema that can silently drift from what `lore push`
        # really writes (see XC-016).
        env:
          # `push` refuses a piped, unattended caller unless it holds the
          # desktop app's launch key (lore/cli.py:_attended), so CI writes one.
          LORE_ATTENDED_KEY: ci
        run: |
          # As the app writes it: a folder and a file only the owner can open.
          (umask 077 && mkdir -p ~/"Library/Application Support/Lore/attended.d" &&
            printf '%s\nci\n' "$$" > ~/"Library/Application Support/Lore/attended.d/ci")
          export LORE_HOME="$(mktemp -d)"
          uv run --project .. python ../../.github/scripts/seed_worker_smoke.py
          uv run --project .. lore push --local --worker-dir .
      - name: Smoke test against a locally served Worker
        env:
          # Must match the topic/teaser seeded above; smoke.ts checks discover()
          # returns this exact publication, not just that some row exists.
          SMOKE_EXPECT_TOPIC: ci-smoke
          SMOKE_EXPECT_TEASER: "worker-smoke: seeded via a real lore push --local"
        run: |
          nohup npm run dev > wrangler-dev.log 2>&1 &
          echo $! > wrangler-dev.pid
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:8787/mcp && break
            sleep 1
          done
          npm run smoke
      - name: Show Worker dev log on failure
        if: failure()
        run: cat wrangler-dev.log
      - name: Stop the Worker
        if: always()
        run: kill "$(cat wrangler-dev.pid)" 2>/dev/null || true
