name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run --extra dev ruff check lore tests evals .github/scripts docs/backlog/agents support/seed
      - run: uv run --extra dev ruff format --check lore tests evals .github/scripts docs/backlog/agents support/seed

  python-unit:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run python -m unittest discover -s tests -v

  python-types:
    name: Python type checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run --extra dev mypy lore evals .github/scripts docs/backlog/agents support/seed

  bridge-check:
    name: Bridge compiler checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      - run: npm run check
      - run: npm test

  desktop-build:
    name: Desktop unit and package checks
    runs-on: macos-14
    defaults:
      run:
        working-directory: app/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: astral-sh/setup-uv@v7
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run package

  desktop-edge:
    name: Desktop edge (${{ matrix.name }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agents
            scenarios: agents faq provision jobs
            dark_connectors: false
          - name: store
            scenarios: automations connectors store checkin
            dark_connectors: false
          - name: sales
            scenarios: today settings cards seller
            dark_connectors: true
          - name: reading
            scenarios: feedback update fresh obsidian reading schedule quiet sell sales
            dark_connectors: false
    defaults:
      run:
        working-directory: app/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: astral-sh/setup-uv@v7
      - run: npm ci
      # Each walk gets its own Lore home, Electron profile, dynamic ports, and
      # test Keychain. Sharding across fresh runners keeps the real renderer
      # coverage while removing it from the serial CI critical path.
      - name: Run ${{ matrix.name }} edge scenarios
        env:
          SCENARIOS: ${{ matrix.scenarios }}
        run: |
          failed=""
          for scenario in $SCENARIOS; do
            echo "::group::$scenario"
            support/edge.sh "$scenario" || failed="$failed $scenario"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::Edge scenarios failed:$failed"
            exit 1
          fi
        timeout-minutes: 12
      - name: Run dark connector edge scenario
        if: matrix.dark_connectors
        env:
          LORE_EDGE_APPEARANCE: dark
        run: support/edge.sh connectors
        timeout-minutes: 5

  desktop-check:
    name: Desktop macOS checks
    if: always()
    needs: [desktop-build, desktop-edge]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every desktop job passed
        env:
          BUILD_RESULT: ${{ needs.desktop-build.result }}
          EDGE_RESULT: ${{ needs.desktop-edge.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$EDGE_RESULT" = success

  node-lint:
    name: Node lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lore/node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      - run: npm run lint

  node-compiler:
    name: Node compiler checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lore/node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      # Burn address: syntactically valid so Wrangler can construct the
      # Worker, never a real payout wallet.
      - run: echo "LORE_WALLET=0x000000000000000000000000000000000000dEaD" > .dev.vars
      - run: npm run types
      - run: npm run check

  node-component:
    name: Node component tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lore/node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      - run: echo "LORE_WALLET=0x000000000000000000000000000000000000dEaD" > .dev.vars
      - name: Run the mocked-facilitator test suite (MON-010)
        run: npm test

  feedback-relay-lint:
    name: Feedback relay lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: feedback-relay
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      - run: npm run lint

  feedback-relay-compiler:
    name: Feedback relay compiler checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: feedback-relay
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      # Placeholder: never a real GitHub token. Lets `wrangler types` resolve
      # the secret binding the same way CI seeds LORE_WALLET for lore/node.
      - run: printf 'LORE_FEEDBACK_GITHUB_TOKEN=not-a-real-token\nPOSTHOG_KEY=not-a-real-key\n' > .dev.vars
      - run: npm run types
      - run: npm run check

  feedback-relay-component:
    name: Feedback relay component tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: feedback-relay
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      - run: printf 'LORE_FEEDBACK_GITHUB_TOKEN=not-a-real-token\nPOSTHOG_KEY=not-a-real-key\n' > .dev.vars
      - name: Run the stubbed-GitHub test suite (XC-028)
        run: npm test

  checkout-lint:
    name: Card checkout lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: checkout
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      - run: npm run lint

  checkout-compiler:
    name: Card checkout compiler checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: checkout
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      # Placeholder: never a real Stripe key. Lets `wrangler types` resolve
      # the secret binding the same way the feedback relay's job does.
      - run: printf "STRIPE_SECRET_KEY=sk_test_not_a_real_key\nSTRIPE_WEBHOOK_SECRET=whsec_not_a_real_secret\nACCOUNT_TOKEN_SECRET=not_a_real_token_secret\n" > .dev.vars
      - run: npm run types
      - run: npm run check

  checkout-component:
    name: Card checkout component tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: checkout
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      - run: printf "STRIPE_SECRET_KEY=sk_test_not_a_real_key\nSTRIPE_WEBHOOK_SECRET=whsec_not_a_real_secret\nACCOUNT_TOKEN_SECRET=not_a_real_token_secret\n" > .dev.vars
      - name: Run the stubbed-Stripe test suite (XC-039)
        run: npm test

  worker-smoke:
    name: Worker smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lore/node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: astral-sh/setup-uv@v7
      - run: npm ci
      - run: echo "LORE_WALLET=0x000000000000000000000000000000000000dEaD" > .dev.vars
      - name: Seed local publications with a real `lore push --local`
        # Runs the actual push path (lore/cli.py:push, :_push_sql) against the
        # same local D1 database discover()/get() read, instead of a
        # hand-copied schema that can silently drift from what `lore push`
        # really writes (see XC-016).
        env:
          # `push` refuses a piped, unattended caller unless it holds the
          # desktop app's launch key (lore/cli.py:_attended), so CI writes one.
          LORE_ATTENDED_KEY: ci
        run: |
          # As the app writes it: a folder and a file only the owner can open.
          (umask 077 && mkdir -p ~/"Library/Application Support/Lore/attended.d" &&
            printf '%s\nci\n' "$$" > ~/"Library/Application Support/Lore/attended.d/ci")
          export LORE_HOME="$(mktemp -d)"
          uv run --project .. python ../../.github/scripts/seed_worker_smoke.py
          uv run --project .. lore push --local --worker-dir .
      - name: Smoke test against a locally served Worker
        env:
          # Must match the topic/teaser seeded above; smoke.ts checks discover()
          # returns this exact publication, not just that some row exists.
          SMOKE_EXPECT_TOPIC: ci-smoke
          SMOKE_EXPECT_TEASER: "worker-smoke: seeded via a real lore push --local"
        run: |
          nohup npm run dev > wrangler-dev.log 2>&1 &
          echo $! > wrangler-dev.pid
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:8787/mcp && break
            sleep 1
          done
          npm run smoke
      - name: Show Worker dev log on failure
        if: failure()
        run: cat wrangler-dev.log
      - name: Stop the Worker
        if: always()
        run: kill "$(cat wrangler-dev.pid)" 2>/dev/null || true
