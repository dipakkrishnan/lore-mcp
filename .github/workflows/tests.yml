name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run --extra dev ruff check lore tests
      - run: uv run --extra dev ruff format --check lore tests

  python-unit:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run python -m unittest discover -s tests -v

  python-types:
    name: Python type checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run --extra dev mypy lore

  bridge-check:
    name: Bridge compiler checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      - run: npm run check
      - run: npm test

  desktop-check:
    name: Desktop macOS checks
    runs-on: macos-14
    defaults:
      run:
        working-directory: app/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: astral-sh/setup-uv@v7
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run package

  node-lint:
    name: Node lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lore/node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      - run: npm run lint

  node-compiler:
    name: Node compiler checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lore/node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      # Burn address: syntactically valid so Wrangler can construct the
      # Worker, never a real payout wallet.
      - run: echo "LORE_WALLET=0x000000000000000000000000000000000000dEaD" > .dev.vars
      - run: npm run types
      - run: npm run check

  node-component:
    name: Node component tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lore/node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      - run: echo "LORE_WALLET=0x000000000000000000000000000000000000dEaD" > .dev.vars
      - name: Run the mocked-facilitator test suite (MON-010)
        run: npm test

  worker-smoke:
    name: Worker smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lore/node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      - run: echo "LORE_WALLET=0x000000000000000000000000000000000000dEaD" > .dev.vars
      - name: Seed an empty local publications table
        # Mirrors the schema `lore push` maintains (lore/cli.py:_push_sql).
        # discover() selects from this table; without it the Worker 500s.
        run: |
          cat <<'SQL' > /tmp/seed-publications.sql
          DROP TABLE IF EXISTS publications;
          CREATE TABLE publications (
            public_id TEXT PRIMARY KEY, title TEXT NOT NULL, content TEXT NOT NULL,
            kind TEXT NOT NULL, topic TEXT NOT NULL DEFAULT '',
            teaser TEXT NOT NULL DEFAULT '', updated_at TEXT NOT NULL DEFAULT ''
          );
          SQL
          npx wrangler d1 execute lore-publications --local --file /tmp/seed-publications.sql -y
      - name: Smoke test against a locally served Worker
        run: |
          nohup npm run dev > wrangler-dev.log 2>&1 &
          echo $! > wrangler-dev.pid
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:8787/mcp && break
            sleep 1
          done
          npm run smoke
      - name: Show Worker dev log on failure
        if: failure()
        run: cat wrangler-dev.log
      - name: Stop the Worker
        if: always()
        run: kill "$(cat wrangler-dev.pid)" 2>/dev/null || true
