name: Deploy feedback relay

# The maintainer-owned feedback relay (XC-028) — never an owner's node.
# Deliberately its own workflow, not a job inside tests.yml, mirroring
# deploy-qa.yml: it must never be reachable from a pull_request trigger (a
# fork PR could otherwise exfiltrate the deploy token or the GitHub issue
# token), so it only ever listens for pushes to main.
on:
  push:
    branches: [main]

# Read-only by default; the one job below that needs to write elevates for
# itself. No job here runs against pull_request or pull_request_target.
permissions:
  contents: read

concurrency:
  group: deploy-feedback-relay
  cancel-in-progress: false

jobs:
  deploy-feedback-relay:
    name: Deploy the feedback relay
    runs-on: ubuntu-latest
    if: github.repository == 'dipakkrishnan/lore-mcp'
    # A protected GitHub Environment, not a repository secret: only this job
    # can read CLOUDFLARE_API_TOKEN and FEEDBACK_GITHUB_TOKEN (once required
    # reviewers are configured on the Environment) only after approval.
    environment: feedback-relay
    defaults:
      run:
        working-directory: feedback-relay
    steps:
      - name: Check whether the feedback relay deploy is configured yet
        # Until an admin sets up the feedback-relay Environment's secrets,
        # every merge to main would otherwise fail this job loudly — reading
        # as a broken build when nothing regressed. Warn once and skip
        # cleanly instead.
        id: configured
        # Overrides the job's feedback-relay default: this step reads only
        # env vars, and runs before actions/checkout has created that
        # directory.
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FEEDBACK_GITHUB_TOKEN: ${{ secrets.FEEDBACK_GITHUB_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$FEEDBACK_GITHUB_TOKEN" ]; then
            echo "::warning::Feedback relay deploy skipped — the 'feedback-relay' GitHub" \
              "Environment needs CLOUDFLARE_API_TOKEN and FEEDBACK_GITHUB_TOKEN secrets" \
              "set. See feedback-relay/README.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.configured.outputs.ready == 'true'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.configured.outputs.ready == 'true'
        with:
          node-version: lts/*

      - run: npm ci
        if: steps.configured.outputs.ready == 'true'

      - name: Deploy the Worker
        if: steps.configured.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      - name: Set the GitHub issue token
        # A fine-grained PAT scoped to dipakkrishnan/lore-mcp only, with
        # exactly one permission: Issues -> Read and write. See
        # feedback-relay/README.md.
        if: steps.configured.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FEEDBACK_GITHUB_TOKEN: ${{ secrets.FEEDBACK_GITHUB_TOKEN }}
        run: |
          printf '%s' "$FEEDBACK_GITHUB_TOKEN" \
            | npx wrangler secret put LORE_FEEDBACK_GITHUB_TOKEN
