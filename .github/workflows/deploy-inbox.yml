name: Deploy inbox

# The Lore-hosted agent inbox (XC-067). Its own workflow, like
# deploy-feedback-relay.yml: it only ever listens for pushes to main, so no
# pull_request can reach the deploy token.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-inbox
  cancel-in-progress: false

jobs:
  deploy-inbox:
    name: Deploy the inbox
    runs-on: ubuntu-latest
    if: github.repository == 'dipakkrishnan/lore-mcp'
    # A protected GitHub Environment: only this job can read
    # CLOUDFLARE_API_TOKEN, and only after approval once reviewers are set.
    environment: inbox
    defaults:
      run:
        working-directory: inbox
    steps:
      - name: Check whether the inbox deploy is configured yet
        id: configured
        # Runs before actions/checkout has created the inbox directory.
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Inbox deploy skipped — the 'inbox' GitHub Environment" \
              "needs a CLOUDFLARE_API_TOKEN secret. See inbox/README.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.configured.outputs.ready == 'true'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.configured.outputs.ready == 'true'
        with:
          node-version: lts/*

      - run: npm ci
        if: steps.configured.outputs.ready == 'true'

      - name: Deploy the Worker
        if: steps.configured.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
