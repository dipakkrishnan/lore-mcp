[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lore-mcp"
version = "0.1.0"
description = "Portable, private, monetizable context for personal agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2",
    "windup @ git+https://github.com/dipakkrishnan/windup.git@372af8a",
]

[project.scripts]
lore = "lore.cli:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.18",
    "ruff>=0.16.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "coverage[toml]>=7.4",
]

[tool.ruff]
extend-exclude = ["lore/node"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
files = ["lore"]
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[tool.setuptools]
packages = ["lore"]

# The deployable Worker source ships inside the package so `lore node deploy`
# works without a git checkout. Explicit file list: dev artifacts in a checkout
# (node_modules, .wrangler, a real .buyer.env) must never enter the wheel.
[tool.setuptools.package-data]
lore = [
    "node/package.json",
    "node/package-lock.json",
    "node/tsconfig.json",
    "node/wrangler.jsonc",
    "node/env.d.ts",
    "node/README.md",
    "node/.dev.vars.example",
    "node/src/*.ts",
    "node/scripts/*.ts",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Only `lore/` counts toward the percentage: including `tests/` would let a large,
# fully-executed test file mask an untested module.
[tool.coverage.run]
source = ["lore"]
branch = true

[tool.coverage.report]
show_missing = true
# The cheap outer guard. `tests/coverage_gate.py` is the real gate: fail_under
# checks one global combined number, so a file at 96% statements / 70% branches
# hides behind it.
fail_under = 90
