[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lore-mcp"
version = "0.1.0"
description = "Portable, private, monetizable context for personal agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2",
    "windup @ git+https://github.com/dipakkrishnan/windup.git@372af8a",
]

[project.scripts]
lore = "lore.cli:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.16.1",
]

[tool.ruff]
extend-exclude = ["lore/node"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.setuptools]
packages = ["lore"]

# The deployable Worker source ships inside the package so `lore node deploy`
# works without a git checkout. Explicit file list: dev artifacts in a checkout
# (node_modules, .wrangler, a real .buyer.env) must never enter the wheel.
[tool.setuptools.package-data]
lore = [
    "node/package.json",
    "node/package-lock.json",
    "node/tsconfig.json",
    "node/wrangler.jsonc",
    "node/env.d.ts",
    "node/README.md",
    "node/.buyer.env.example",
    "node/.dev.vars.example",
    "node/src/*.ts",
    "node/scripts/*.ts",
]
