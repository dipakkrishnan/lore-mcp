[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lore-mcp"
version = "0.1.0"
description = "Portable, private, monetizable context for personal agents"
readme = "README.md"
# 3.12 is a floor set by SQLite, not by any language feature Lore uses. Lore's
# search is FTS5/BM25, and a deployed node reads an exported bundle with the same
# code. The AWS Lambda python3.10 and python3.11 runtimes ship SQLite 3.7.17 with
# no FTS5 module, which cannot even open a bundle; python3.12 ships 3.40.0, which
# can. Keeping the local floor and the deployment floor identical is what stops a
# node from being deployable but unsearchable. See
# docs/fts5-lambda-runtime-spike.md.
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2",
    "windup @ git+https://github.com/dipakkrishnan/windup.git@372af8a",
]

[project.scripts]
lore = "lore.cli:main"

[tool.setuptools]
packages = ["lore"]
