<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Lore</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-state="loading">
    <section id="welcome" class="welcome" hidden>
      <div class="welcome-inner">
        <span class="mark mark-lg" aria-hidden="true"><svg viewBox="0 0 26 26" fill="none"><rect x="4.5" y="5" width="17" height="16" rx="3.2" fill="currentColor"></rect><path d="M3 11.2L4.5 10.6C8 9.2 10.5 12.2 13 10.9S18.5 9.6 21.5 11.2L23 12" stroke="var(--accent)" stroke-width="1.7"></path><path d="M3 16.9L4.5 16.3C8 15 10.5 17.8 13 16.6S18.5 15 21.5 16.8L23 17.7" stroke="var(--accent)" stroke-width="1.7"></path></svg></span>
        <h1 data-wraps>Turn what you've learned<br />into pieces agents pay for.</h1>
        <p class="welcome-sub">Your notes stay on this Mac.</p>
        <p id="welcome-back" class="welcome-back" role="status" hidden></p>
        <div class="welcome-actions">
          <button type="button" class="btn provider" data-login="anthropic:oauth"><img src="assets/claude.svg" alt="" width="20" height="20" /> Continue with Claude</button>
          <button type="button" class="btn provider" data-login="openai-codex:oauth"><img src="assets/openai.svg" alt="" width="20" height="20" /> Continue with ChatGPT</button>
          <button type="button" class="btn quiet" id="welcome-key">Use an API key instead</button>
        </div>
        <form id="key-form" class="key-form" hidden>
          <select id="key-provider" aria-label="API provider">
            <option value="anthropic">Anthropic</option>
            <option value="openai">OpenAI</option>
          </select>
          <input id="key-secret" type="password" required autocomplete="off" placeholder="API key" aria-label="API key" />
          <button type="submit" class="btn primary">Save</button>
        </form>
        <p id="welcome-note" class="hint" role="status" aria-live="polite"></p>
        <form id="redirect-form" class="key-form" hidden>
          <input id="redirect-url" type="text" required autocomplete="off" placeholder="Paste the redirect URL" aria-label="Redirect URL" />
          <button type="submit" class="btn primary">Continue</button>
        </form>
        <button type="button" class="btn secondary" id="welcome-retry" hidden>Try again</button>
      </div>
    </section>

    <div id="app" class="app" hidden>
      <div class="titlebar" aria-hidden="true"></div>
      <aside>
        <div class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 26 26" fill="none"><rect x="4.5" y="5" width="17" height="16" rx="3.2" fill="currentColor"></rect><path d="M3 11.2L4.5 10.6C8 9.2 10.5 12.2 13 10.9S18.5 9.6 21.5 11.2L23 12" stroke="var(--accent)" stroke-width="1.7"></path><path d="M3 16.9L4.5 16.3C8 15 10.5 17.8 13 16.6S18.5 15 21.5 16.8L23 17.7" stroke="var(--accent)" stroke-width="1.7"></path></svg></span> Lore<button type="button" class="update" id="update" hidden>Update</button></div>
        <button type="button" id="search" class="search" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
          <span>Find or capture</span>
          <kbd>⌘K</kbd>
        </button>
        <nav aria-label="Main">
          <button type="button" data-view="today" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>Today</button>
          <button type="button" data-view="inventory" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 7.5L12 3l8.5 4.5L12 12z"></path><path d="M3.5 12L12 16.5 20.5 12"></path><path d="M3.5 16.5L12 21l8.5-4.5"></path></svg>Inventory<span class="count" data-count="inventory"></span></button>
          <button type="button" data-view="connectors" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1.5 1.5"></path><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1.5-1.5"></path></svg>Connectors<span class="count" data-count="connectors"></span></button>
          <button type="button" data-view="automations" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>Automations</button>
        </nav>
        <div class="account">
          <button type="button" id="account" class="account-trigger" popovertarget="account-menu" aria-haspopup="menu"></button>
          <div id="account-menu" class="account-menu" popover role="menu" aria-label="Account">
            <p id="account-line" class="account-line"></p>
            <button type="button" role="menuitem" data-view="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>Settings<kbd>⌘,</kbd></button>
            <button type="button" role="menuitem" data-view="faq"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9.5a2.5 2.5 0 0 1 4.9.7c0 1.7-2.4 2.3-2.4 3.8M12 17h.01"></path></svg>Help &amp; FAQ</button>
            <button type="button" role="menuitem" id="feedback-open" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 15a2 2 0 0 1-2 2H8l-4 4V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z"></path></svg>Report feedback</button>
            <button type="button" role="menuitemcheckbox" id="dark-mode" aria-checked="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg>Dark mode<span class="switch" aria-hidden="true"></span></button>
            <hr />
            <button type="button" role="menuitem" id="sign-out" class="sign-out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l-4-4 4-4M6 12h10"></path></svg>Sign out</button>
          </div>
        </div>
      </aside>
      <main id="main" tabindex="-1">
        <header>
          <div class="task-actions">
            <button type="button" class="back" id="task-back" hidden>← Today</button>
            <button type="button" class="btn quiet" id="task-restart" hidden>Start over</button>
          </div>
          <p class="eyebrow" id="eyebrow"></p>
          <h1 id="title"></h1>
          <div class="header-actions">
            <button type="button" class="btn quiet" id="first-run-skip" hidden>Skip for now</button>
            <button type="button" class="btn secondary" id="sell-writing" hidden>Sell something you wrote</button>
            <button type="button" class="btn primary" id="add-memory" hidden>+ Add Memory</button>
          </div>
        </header>
        <section id="capture" class="capture-area" aria-label="Capture">
          <div id="agent" class="agent" hidden>
            <div id="blueprint"></div>
            <div id="log" class="log" aria-live="polite"></div>
            <div id="request"></div>
            <div id="detail" class="detail"></div>
          </div>
          <form id="composer" class="composer">
            <label class="sr-only" for="capture-input">What did you learn today?</label>
            <textarea id="capture-input" rows="1" placeholder="What did you learn today?"></textarea>
            <div id="dictation" class="dictation" hidden><i class="rec"></i><span id="dictation-text"></span></div>
            <div id="attachments" class="attachments"></div>
            <div class="composer-actions">
              <button type="button" class="icon-btn" id="dictate" title="Dictate" aria-label="Dictate"><svg class="stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"></rect></svg><svg class="mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"></path><path d="M19 11a7 7 0 0 1-14 0M12 18v3"></path></svg></button>
              <button type="button" class="icon-btn" id="attach" title="Add a file" aria-label="Add a file"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12l-8.5 8.5a5 5 0 0 1-7-7L14 5a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 8"></path></svg></button>
              <button type="submit" class="btn primary" id="capture-submit">Capture</button>
            </div>
          </form>
        </section>
        <div id="status" class="status" role="status" aria-live="polite"></div>
        <div id="content"></div>
      </main>
    </div>
    <dialog id="palette" class="palette" aria-label="Find or capture a memory">
      <form class="card palette-panel">
        <input id="palette-input" type="search" placeholder="Find a memory, or type one to capture…" aria-label="Find or capture a memory" autocomplete="off" role="combobox" aria-expanded="true" aria-controls="palette-list" aria-autocomplete="list" />
        <div id="palette-list" class="palette-list" role="listbox" aria-label="Memories"></div>
        <footer class="palette-keys"><span><kbd>↑↓</kbd> navigate</span><span><kbd>↵</kbd> <em id="palette-enter">open</em></span><span><kbd>esc</kbd> dismiss</span></footer>
      </form>
    </dialog>
    <script src="../node_modules/marked/lib/marked.umd.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
